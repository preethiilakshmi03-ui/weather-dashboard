
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🌦️ Weather Dashboard</h1>
            <p>Check real-time weather around the world</p>
        </header>

        <div class="search-box">
            <input type="text" id="cityInput"
                placeholder="Enter city name...">
            <button id="searchBtn">Search</button>
        </div>

        <p id="errorMessage"></p>

        <section class="weather-card" id="weatherCard">
            <h2 id="cityName">Search for a city</h2>
            <div class="weather-icon" id="weatherIcon">🌤️</div>
            <h1 id="temperature">--°C</h1>
            <p id="description">Weather condition</p>

            <div class="details">
                <div>
                    <h3>💧 Humidity</h3>
                    <p id="humidity">--%</p>
                </div>

                <div>
                    <h3>💨 Wind Speed</h3>
                    <p id="wind">-- km/h</p>
                </div>
            </div>
        </section>

        <section class="forecast-section">
            <h2>5-Day Forecast</h2>
            <div class="forecast-container" id="forecast">
                <p>Search a city to see forecast</p>
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
